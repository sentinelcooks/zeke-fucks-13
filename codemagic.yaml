workflows:
  sentinel-ios-app-store:
    name: Sentinel iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Sentinel

    environment:
      xcode: latest
      node: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sentinelprops.app

      groups:
        - sentinel_ios_env

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.sentinelprops.app"

    scripts:
      - name: Install JavaScript dependencies
        script: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Set exempt encryption flag
        script: |
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

      - name: Set iOS build number
        script: |
          cd ios/App
          # Build 12 has already been used; never let CI overwrite the project
          # bump with a lower Codemagic counter for the next App Store upload.
          MIN_BUILD_NUMBER=13
          if [ "${PROJECT_BUILD_NUMBER:-0}" -gt "$MIN_BUILD_NUMBER" ]; then
            NEXT_BUILD_NUMBER="$PROJECT_BUILD_NUMBER"
          else
            NEXT_BUILD_NUMBER="$MIN_BUILD_NUMBER"
          fi
          agvtool new-version -all "$NEXT_BUILD_NUMBER"

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          echo "Fixing Capacitor SPM package before Xcode build..."

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("ios/App/CapApp-SPM/Package.swift")
          s = p.read_text()

          # Fix Windows paths if Capacitor generated them
          s = s.replace("\\", "/")

          # Make sure Capacitor 8 SwiftPM dependency exists
          cap_line = '        .package(url: "https://github.com/ionic-team/capacitor-swift-pm.git", exact: "8.3.1"),'
          if "capacitor-swift-pm.git" not in s:
              s = s.replace("    dependencies: [\n", "    dependencies: [\n" + cap_line + "\n", 1)

          p.write_text(s)
          print(s)

          # Widen the Apple Sign In plugin's capacitor-swift-pm requirement so
          # it accepts Capacitor 8.x. Upstream pins `from: "7.0.0"` which SPM
          # treats as 7.0.0..<8.0.0 — conflicts with the rest of the graph.
          plugin_pkg = Path("node_modules/@capacitor-community/apple-sign-in/Package.swift")
          if plugin_pkg.exists():
              t = plugin_pkg.read_text()
              t_new = re.sub(
                  r'\.package\(\s*url:\s*"https://github\.com/ionic-team/capacitor-swift-pm\.git"\s*,\s*from:\s*"7\.0\.0"\s*\)',
                  '.package(url: "https://github.com/ionic-team/capacitor-swift-pm.git", "7.0.0"..<"9.0.0")',
                  t,
              )
              if t_new != t:
                  plugin_pkg.write_text(t_new)
                  print("Patched apple-sign-in Package.swift capacitor-swift-pm range")
              else:
                  print("apple-sign-in Package.swift already patched or pattern not found")
          PY

          rm -f ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
