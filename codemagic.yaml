workflows:
  sentinel-ios-app-store:
    name: Sentinel iOS App Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Sentinel

    environment:
      xcode: latest
      node: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.sentinelprops.app

      groups:
        - sentinel_ios_env

      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.sentinelprops.app"

    scripts:
      - name: Install JavaScript dependencies
        script: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios

      - name: Set exempt encryption flag
        script: |
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist

      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles

        - name: Build IPA
        script: |
          echo "Fixing Capacitor SPM package before Xcode build..."

          python3 <<'PY'
          from pathlib import Path

          p = Path("ios/App/CapApp-SPM/Package.swift")
          s = p.read_text()

          # Fix Windows paths if Capacitor generated them
          s = s.replace("\\", "/")

          # Remove incompatible Apple Sign In native plugin from SPM graph
          lines = s.splitlines()
          lines = [
              line for line in lines
              if "CapacitorCommunityAppleSignIn" not in line
              and "@capacitor-community/apple-sign-in" not in line
          ]
          s = "\n".join(lines) + "\n"

          # Make sure Capacitor 8 SwiftPM dependency exists
          cap_line = '        .package(url: "https://github.com/ionic-team/capacitor-swift-pm.git", exact: "8.3.1"),'
          if "capacitor-swift-pm.git" not in s:
              s = s.replace("    dependencies: [\n", "    dependencies: [\n" + cap_line + "\n", 1)

          p.write_text(s)
          print(s)
          PY

          rm -f ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -list -project ios/App/App.xcodeproj
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
